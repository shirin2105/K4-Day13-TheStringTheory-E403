service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: 99.5% request windows keep P95 latency at or below 3 seconds.
  error_rate_pct:
    objective: 2
    target: 99.0
    note: 99% of measurement windows keep user-visible errors below 2%.
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Daily model spend remains inside the USD 2.50 lab budget.
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: 95% of measurement windows maintain average quality at or above 0.75.
